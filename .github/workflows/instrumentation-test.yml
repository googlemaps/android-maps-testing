# A workflow that boots an Android emulator and runs connected instrumentation tests
name: Run instrumentation tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  run-instrumentation-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 35

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Inject Secrets
        env:
          MAPS_API_KEY: ${{ secrets.ACTIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -z "$MAPS_API_KEY" ] && MAPS_API_KEY="YOUR_API_KEY"
          [ -z "$GEMINI_API_KEY" ] && GEMINI_API_KEY="YOUR_GEMINI_API_KEY"
          echo "MAPS_API_KEY=$MAPS_API_KEY" > ./secrets.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> ./secrets.properties

      - name: Build Debug Artifacts
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run Android Emulator Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedAndroidTest --stacktrace

      # Stage coverage reports flat, named after their module, for coverage-history.yml post-merge reuse
      - name: Stage coverage reports
        if: always()
        run: |
          mkdir -p instrumentation-coverage
          for report in */build/reports/coverage/androidTest/debug/connected/report.xml; do
            [ -e "$report" ] || continue
            module_name=$(echo "$report" | cut -d'/' -f1)
            cp "$report" "instrumentation-coverage/${module_name}.xml"
          done
          ls -l instrumentation-coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-coverage
          path: instrumentation-coverage
          if-no-files-found: warn

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-test-reports
          path: |
            */build/reports/androidTests/
            */build/reports/coverage/
