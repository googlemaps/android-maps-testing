name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Create .gpg key
        run: |
          echo $GPG_KEY_ARMOR | base64 --decode > ./release.asc
          gpg --quiet --output $GITHUB_WORKSPACE/release.gpg --dearmor ./release.asc

          echo "Build and publish"
          {
            echo
            printf 'mavenCentralUsername=%s\n' "$SONATYPE_TOKEN_USERNAME"
            printf 'mavenCentralPassword=%s\n' "$SONATYPE_TOKEN_PASSWORD"
            printf 'signing.keyId=%s\n' "$GPG_KEY_ID"
            printf 'signing.password=%s\n' "$GPG_PASSWORD"
            printf 'signing.secretKeyRingFile=%s\n' "$GITHUB_WORKSPACE/release.gpg"
          } >> gradle.properties
        env:
          GPG_KEY_ARMOR: ${{ secrets.SYNCED_GPG_KEY_ARMOR }}
          GPG_KEY_ID: ${{ secrets.SYNCED_GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.SYNCED_GPG_KEY_PASSWORD }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN }}

      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --warn --stacktrace
